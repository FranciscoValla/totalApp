<div class="custom-modal-overlay" (click)="onClose()">


  <div class="card border border-0 rounded p-0 shadow" [ngClass]="binInput().color"
    (click)="$event.stopPropagation()">
    <div class="card-header align-items-center p-2 {{textColor()}}"
      style="cursor: p; font-size: 24px !important; font-weight: 600;">
      @if(binInput().img) {
      <div class="col-12">
        <img [src]="binInput().img" class="w-100 rounded img-base">
      </div>
      }
      <textarea type="text" placeholder="Titulo..." style="font-size: 24px;" [(ngModel)]="binInput().title"
        class="w-100 {{textColor()}}" rows="1"> </textarea>
    </div>
    <div class="card-body pt-0 p-2" style="cursor: p;">
      <textarea type="text" placeholder="Añade una nota..." style="font-size: 16px;" class="w-100 {{textColor()}}"
        [rows]="5" [(ngModel)]="binInput().content"></textarea>
    </div>
    <div class="position-relative card-footer text-end">
      <div class="row px-2">
        <div class="py-1 col-2 col-md-1 d-flex justify-content-center align-items-center rounded"
        (click)="$event.stopPropagation(); isRestored.set(false); deleteBin(binInput());"
        data-bs-toggle="tooltip" data-bs-placement="top"  title="Borrar Nota Permanentemente">
          <i class="fa-solid fa-trash {{textColor()}}" style="cursor: pointer; font-size: 16px !important;"></i>
        </div>
        <div class="py-1 col-2 col-md-1 d-flex justify-content-center align-items-center rounded"
        (click)="$event.stopPropagation(); isRestored.set(true); deleteBin(binInput());"
        data-bs-toggle="tooltip" data-bs-placement="top"  title="Restaurar Nota">
          <i class="fa-solid fa-trash-can-arrow-up {{textColor()}}"></i>
        </div>
      </div>
    </div>
  </div>
</div>
