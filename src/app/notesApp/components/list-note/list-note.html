<div class="card rounded p-0 {{note().color}}" [ngClass]="note().color === 'bg-white' ? 'border border-dark' : 'border border-0' " >
  <div class="card-header align-items-center p-0 {{textColor()}}"
    style="cursor: p; font-size: 20px !important; font-weight: 600;" (click)="onEmit()">
    @if(note().img) {
      <div class="col-12 rounded">
        <img [src]="note().img" class="w-100 img-base rounded">
      </div>
    }
    <p class="m-0 p-0 px-3 pt-2">{{note().title}}</p>
  </div>
  <div class="card-body p-3" style="cursor: p;" (click)="onEmit()">
    @if ( !isArray() ) {
      <p class="card-text {{textColor()}}">{{note().content}}</p>
    } @else {
      <table class="table table-borderless">
        <tbody>
          @for (item of (contentAsArray()); track $index) {
            @if( item.type ) {
              <tr>
                <th class="p-0 m-0 bg-transparent {{textColor()}}" style="width: 26px !important;">
                  <i class="fa-regular fa-square" style="font-size: 18px !important;"
                  (click)="$event.stopPropagation(); changeState($index)"></i>
                </th>
                <td class="p-0 m-0 bg-transparent {{textColor()}}">{{ item.txt }}</td>
              </tr>
            }
          }
          </tbody>
      </table>
      <table class="table table-borderless border-top {{textColor()}} mt-2">
        <tbody>
          @for (item of (contentAsArray()); track $index) {
            @if( !item.type ) {
              <tr class="">
                <th scope="row" class="p-0 m-0 bg-transparent {{textColor()}}" style="width: 26px !important;">
                  <i class="fa-regular fa-square-check text-decoration-line-through" style="font-size: 18px !important;"
                  (click)="$event.stopPropagation(); changeState($index)"></i>
                </th>
                <td class="text-decoration-line-through p-0 bg-transparent {{textColor()}}">{{ item.txt }}</td>
              </tr>
            }
          }
        </tbody>
      </table>
    }
  </div>
  <div class="position-relative card-footer p-0 m-0 pb-1">
    <atom-footer
    [noteInput]="note()"
    [isList]="true"
    (refresOutput)="refreshNotes($event.type, $event.txt)"
    /* (updateOutput)="noteCurrent.set($event)" */
    (loadOutput)="loadSignal.emit($event)"></atom-footer>
  </div>
</div>
