<div class="position-absolute bg-white shadow z-3 recuadro-paleta" style="width: 150px !important;">
  <div class="row justify-content-center position-relative p-1">
    @for (item of listadoColores; track $index) {
      <div class="selectC {{item.bg}} {{item.border}}"
      (click)="colorSelecionado.set(item.bg); changueColor();"
      [class.colorActivo]="colorSelecionado() === item.bg">
      </div>
    }
  </div>
</div>
