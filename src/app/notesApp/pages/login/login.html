<div class="container">
  <button type="button" class="btn" style="font-size: 20px;"
  (click)="backPage()">
    <i class="fa-solid fa-circle-left"></i> Atras
  </button>
  <div class="row justify-content-md-center">
    <div class="col-8 col-md-6 col-lg-4 mt-4">
      <div class="form-floating mb-3">
          <input type="email" class="form-control" id="email" placeholder="name@example.com"
          [(ngModel)]="email">
          <label for="email">Correo Electrónico</label>
        </div>
        <div class="form-floating">
          <input type="password" class="form-control" id="password" placeholder="Escribe aqui tu contraseña"
          [(ngModel)]="password">
          <label for="password">Contraseña</label>
        </div>
        <button type="submit" class="btn btn-primary w-100 mt-4" (click)="login()">Iniciar Sesión</button>
        <p class="text-start mt-4 text-uppercase fs-5">Inicia Sesión para guardar tus notas en la nube y poder ver desde cualquier otro dispositivo.</p>
    </div>
  </div>
</div>
