<div class="container" [class.d-block]="!load()">
  @if ( binList().length > 0) {
  <h3 class="titleb mt-3 mb-3">La Notas borradas se agregan en esta papelera
    <a class="link-underline-danger" (click)="cleanBin()" style="cursor: pointer;">Vaciar papelera</a>
  </h3>
  <div class="row mt-2">
    @for (item of binList(); track item.id) {
    <list-bin class="col-6 col-xs-12 col-sm-6 col-md-4 col-lg-3 mb-3"
    [bin]="item"
    (binOutput)="isOpen($event)"
    (loadSignal)="load.set($event)"
    ></list-bin>
    }
  </div>
  } @else {
    <div class="row justify-content-md-center mt-5">
    <div class="col-12 text-center mt-5">
      <i class="fa-solid fa-trash text-secondary" style="cursor: pointer; font-size: 48px !important;"></i>
      <p class="titleb text-secondary" style="font-size: 48px !important; margin-left: 10px !important;">Papelera Vacía</p>
    </div>
  </div>
  }
</div>

<div class="spinner-border position-absolute top-50 start-50" [class.d-none]="!load()" style="width: 5rem; height: 5rem;" role="status">
  <span class="visually-hidden ">Loading...</span>
</div>
<!-- Simplificado: Eliminamos el @if estructural -->
@if ( showModal() && binModal(); as binSelected) {
  <modal-bin class="position-absolute top-50 start-50"
  [binInput]="binSelected"
  (emitClose)="showModal.set(false);
  binModal.set(null)"
  (loadSignal)="load.set($event)">
  </modal-bin>
}
